<!doctype html>
<html lang="en" dir="ltr" class="hydrated">
  <head>
    <meta charset="UTF-8" />
    <title>LlamaMobile Capacitor Plugin Test</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 20px;
        margin: 0;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 20px;
      }
      .section {
        margin-bottom: 30px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .section h2 {
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
      }
      input[type="text"], textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }
      button {
        background-color: #007AFF;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-right: 10px;
        margin-bottom: 10px;
      }
      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      .result {
        margin-top: 15px;
        padding: 10px;
        background-color: #f5f5f5;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 4px;
        font-weight: 500;
      }
      .status.success {
        background-color: #d4edda;
        color: #155724;
      }
      .status.error {
        background-color: #f8d7da;
        color: #721c24;
      }
      .status.info {
        background-color: #d1ecf1;
        color: #0c5460;
      }
      select {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>LlamaMobile Capacitor Plugin Test</h1>
      
      <div class="section">
        <h2>Model Selection</h2>
        <label for="modelSelect">Select Model:</label>
        <select id="modelSelect"></select>
        <button onclick="loadModel()">Load Model</button>
        <div id="loadStatus" class="status" style="display: none;"></div>
      </div>
      
      <div class="section">
        <h2>Embedding Test</h2>
        <label for="embeddingText">Text to Embed:</label>
        <textarea id="embeddingText">Hello, this is a test for embedding generation.</textarea>
        <button onclick="generateEmbedding()" id="embeddingBtn" disabled>Generate Embedding</button>
        <div id="embeddingStatus" class="status" style="display: none;"></div>
        <div id="embeddingResult" class="result" style="display: none;"></div>
      </div>
    </div>

    <script src="./js/example.js" type="module"></script>
  </body>
</html>
