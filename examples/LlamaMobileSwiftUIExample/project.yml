name: LlamaMobileSwiftUIExample
targets:
  LlamaMobileSwiftUIExample:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    settings:
      base:
        SWIFT_VERSION: "6.2"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - framework: ../../llama_mobile-ios-SDK/Frameworks/llama_mobile.xcframework
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: "com.llama-mobile.LlamaMobileSwiftUIExample"
        CFBundleName: "LlamaMobileSwiftUIExample"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIMainStoryboardFile: ""
        UIApplicationSceneManifest: {
          UIApplicationSupportsMultipleScenes: false
        }
        UILaunchScreen: {
          UILaunchScreenName: ""
        }