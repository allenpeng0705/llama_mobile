# AndroidX properties
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Gradle JVM settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Suppress AGP warning about compileSdk 36
android.suppressUnsupportedCompileSdk=36

# Suppress Java compiler deprecation warnings
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Suppress Gradle deprecation warnings
org.gradle.warning.mode=none

# Suppress Kotlin compile daemon warnings
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.incremental=false

# Suppress build warnings
android.nonTransitiveRClass=false
